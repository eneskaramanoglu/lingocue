name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache libmpv (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: build/native/win-x64
          key: libmpv-win-x64-${{ hashFiles('build/fetch-libmpv.ps1') }}

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          ffmpeg -hide_banner -version | Select-Object -First 1

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Restore
        run: dotnet restore LingoCue.slnx

      - name: Build
        run: dotnet build LingoCue.slnx --configuration Release --no-restore

      - name: Test
        env:
          LINGOCUE_REQUIRE_FFMPEG: '1'
        run: dotnet test --solution LingoCue.slnx --configuration Release --no-build

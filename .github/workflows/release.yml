name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), e.g. 0.1.0'
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/LingoCue.App/LingoCue.App.csproj

jobs:
  package:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          # Pinned arm64 image: the macos-latest label sometimes queues without a runner and is cancelled.
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache libmpv (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: build/native/win-x64
          key: libmpv-win-x64-${{ hashFiles('build/fetch-libmpv.ps1') }}

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }

      - name: Install FFmpeg, mpv and dylibbundler (macOS)
        if: runner.os == 'macOS'
        # ffmpeg-full: the plain Homebrew ffmpeg has no libass, which subtitle burn-in needs.
        run: brew install ffmpeg-full mpv dylibbundler

      - name: Test
        env:
          LINGOCUE_REQUIRE_FFMPEG: '1'
        run: dotnet test --solution LingoCue.slnx --configuration Release

      - name: Publish
        shell: bash
        run: >
          dotnet publish "$PROJECT" -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      # Windows: Velopack Setup.exe (per-user, no admin), portable zip and the update feed. The previous
      # release's feed and full package are fetched first so this version gets a small delta package.
      - name: Velopack package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          $out = 'artifacts/velopack'
          New-Item -ItemType Directory -Force $out | Out-Null
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN --outputDir $out
          if ($LASTEXITCODE -ne 0) { Write-Host "No earlier Velopack release to build a delta from."; $global:LASTEXITCODE = 0 }
          $previous = @(Get-ChildItem $out -Filter *.nupkg | ForEach-Object Name)
          bash build/release-notes.sh ${{ steps.ver.outputs.version }} > release-notes.md
          ./build/windows/pack.ps1 -PublishDir publish/${{ matrix.rid }} -Version ${{ steps.ver.outputs.version }} -OutputDir $out -ReleaseNotes release-notes.md
          # Upload only this version's packages plus the feed; older packages stay in their own releases.
          New-Item -ItemType Directory -Force artifacts/upload | Out-Null
          Get-ChildItem $out | Where-Object { $previous -notcontains $_.Name } | Copy-Item -Destination artifacts/upload

      - name: Bundle .app and disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash build/macos/make-app.sh publish/${{ matrix.rid }} artifacts ${{ steps.ver.outputs.version }}
          mkdir -p artifacts/upload
          bash build/macos/make-dmg.sh artifacts/LingoCue.app artifacts/upload/LingoCue-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.dmg
          rm -rf artifacts/LingoCue.app

      - uses: actions/upload-artifact@v7
        with:
          name: LingoCue-${{ matrix.rid }}
          path: artifacts/upload/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    # Publish whatever packaged (e.g. Windows when no macOS runner was available); a missing
    # platform can be added later with: gh run rerun <id> --failed, then gh release upload.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.package.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          bash build/release-notes.sh "$tag" > notes.md
          # Setup.exe, portable zip, Velopack feed (releases.win.json, nupkg) and the macOS .dmg.
          ls -la dist
          gh release create "$tag" dist/* --title "LingoCue $tag" --notes-file notes.md --verify-tag
